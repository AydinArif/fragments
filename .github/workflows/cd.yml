# .github/workflows/cd.yml

name: cd

on:
  push:
    # Trigger when pushing a new version tag (vX.Y.Z)
    tags:
      - 'v**'

jobs:
  aws:
    name: AWS Deployment
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Check out repo
      - name: Check out code
        uses: actions/checkout@v4

      # Step 2 — Set up Buildx for multi-platform docker builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3 — Configure AWS credentials (GitHub → AWS)
      # These credentials NEVER go inside the container.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # Step 4 — Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 5 — Build & Push Docker Image to ECR
      - name: Build and push image to Amazon ECR
        uses: docker/build-push-action@v6
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO: fragments
          VERSION_TAG: ${{ github.ref_name }}
        with:
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.VERSION_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest

      # Step 6 — Render ECS task definition with updated image reference
      - name: Render ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO: fragments
          VERSION_TAG: ${{ github.ref_name }}
        with:
          task-definition: fragments-definition.json
          container-name: fragments-container
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.VERSION_TAG }}

          # Environment variables INSIDE the ECS container
          # NO AWS credentials here — ECS uses LabRole now
          environment-variables: |
            NODE_ENV=production
            LOG_LEVEL=info
            AWS_S3_BUCKET_NAME=aydin-arif-fragments
            AWS_COGNITO_POOL_ID=${{ secrets.AWS_COGNITO_POOL_ID }}
            AWS_COGNITO_CLIENT_ID=${{ secrets.AWS_COGNITO_CLIENT_ID }}
            HTPASSWD_FILE=/etc/htpasswd/.htpasswd

      # Step 7 — Deploy updated task definition to ECS service
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: fragments-cluster
          service: fragments-service
