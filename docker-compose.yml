services:
  # Fragments microservice API server
  fragments:
    init: true
    build: .
    environment:
      - API_URL=http://localhost:8080
      - HTPASSWD_FILE=tests/.htpasswd
      - LOG_LEVEL=${LOG_LEVEL:-info}

      # --- REQUIRED AWS CREDS FOR LOCALSTACK ---
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_SESSION_TOKEN=test

      # AWS region
      - AWS_REGION=us-east-1

      # LocalStack + DynamoDB Local endpoints
      - AWS_S3_ENDPOINT_URL=http://localstack:4566
      - AWS_DYNAMODB_ENDPOINT_URL=http://dynamodb-local:8000

      # Resource names
      - AWS_S3_BUCKET_NAME=aarif24-fragments
      - AWS_DYNAMODB_TABLE_NAME=fragments

    ports:
      - "8080:8080"

  # DynamoDB Local
  dynamodb-local:
    image: amazon/dynamodb-local
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory"]

  # LocalStack (S3 mock)
  localstack:
    image: localstack/localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
